<?xml version="1.0" encoding="UTF-8"?>
<!-- ════════════════════════════════════════════════════════════════════════════
     karban-icon.svg — لوگوی اختصاصی کاربان
     ───────────────────────────────────────────────────────────────────────────
     نماد: ترازوی عدالت (عدالت، توازن حقوقی) با قلم (قرارداد) — مفهوم اصلی برند کاربان
     طراحی: مینیمال، خطی، با گرادیان طلایی (هماهنگ با پالت سایت)
     سایز: 256×256 — قابل scale بدون افت کیفیت، مناسب favicon تا لوگوی هدر

     استفاده در index.html:
       <link rel="icon" type="image/svg+xml" href="/karban-icon.svg" />

     استفاده در هدر (Layout.tsx):
       <img src="/karban-icon.svg" alt="کاربان" />

     جایگزین: Gemini_Generated_Image_3xp4kz3xp4kz3xp4-removebg-preview.png
     ════════════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="لوگوی کاربان">
  <defs>
    <linearGradient id="karbanGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C476"/>
      <stop offset="50%" stop-color="#D8A53F"/>
      <stop offset="100%" stop-color="#A8861B"/>
    </linearGradient>
    <linearGradient id="karbanGoldShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E8A4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8C476" stop-opacity="0"/>
    </linearGradient>
    <filter id="karbanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه دایره‌ای مات (اختیاری برای favicon) -->
  <circle cx="128" cy="128" r="124" fill="#0A0F1C" stroke="url(#karbanGold)" stroke-width="2" opacity="0.95"/>

  <!-- ستون مرکزی ترازو -->
  <rect x="124" y="60" width="8" height="120" rx="2" fill="url(#karbanGold)"/>

  <!-- قاعده ستون (پایه) -->
  <path d="M 96 178 L 160 178 L 152 188 L 104 188 Z" fill="url(#karbanGold)"/>
  <rect x="92" y="186" width="72" height="6" rx="2" fill="url(#karbanGold)"/>

  <!-- تیر ترازو (بالای ستون) -->
  <rect x="60" y="56" width="136" height="6" rx="3" fill="url(#karbanGold)"/>
  <circle cx="128" cy="59" r="6" fill="url(#karbanGold)"/>

  <!-- زنجیرها (به کفه‌ها) -->
  <line x1="68" y1="62" x2="68" y2="92" stroke="url(#karbanGold)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="188" y1="62" x2="188" y2="92" stroke="url(#karbanGold)" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- کفه چپ (متمایل به پایین — سمت کارفرما) -->
  <path d="M 68 92 Q 48 100 40 118 Q 50 130 70 130 Q 86 130 96 118 Q 88 100 68 92 Z"
        fill="url(#karbanGold)" opacity="0.9"/>
  <path d="M 68 92 Q 48 100 40 118 Q 50 130 70 130 Q 86 130 96 118 Q 88 100 68 92 Z"
        fill="url(#karbanGoldShine)"/>

  <!-- کفه راست (متمایل به بالا — سمت کارگر/کارمند) -->
  <path d="M 188 92 Q 208 96 216 110 Q 210 122 192 122 Q 174 122 168 110 Q 172 96 188 92 Z"
        fill="url(#karbanGold)" opacity="0.9"/>
  <path d="M 188 92 Q 208 96 216 110 Q 210 122 192 122 Q 174 122 168 110 Q 172 96 188 92 Z"
        fill="url(#karbanGoldShine)"/>

  <!-- قلم قرارداد (روی پایه ستون — نماد قرارداد) -->
  <g transform="translate(128, 130) rotate(-15)">
    <rect x="-2" y="-30" width="4" height="48" rx="1" fill="url(#karbanGold)"/>
    <path d="M -2 18 L 2 18 L 0 24 Z" fill="url(#karbanGold)"/>
    <rect x="-2" y="-32" width="4" height="4" rx="1" fill="#0A0F1C"/>
  </g>

  <!-- حروف "ک" (میکرو — اختیاری برای هویت) -->
  <text x="128" y="222" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="url(#karbanGold)">کاربان</text>
</svg>
