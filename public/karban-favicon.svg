<?xml version="1.0" encoding="UTF-8"?>
<!-- ════════════════════════════════════════════════════════════════════════════
     karban-favicon.svg — نسخه ساده برای favicon (بدون متن)
     ───────────────────────────────────────────────────────────────────────────
     طراحی متقارن و مینیمال — مناسب برای:
       - favicon مرورگر (۱۶×۱۶ تا ۵۱۲×۵۱۲)
       - apple-touch-icon
       - آیکن PWA

     نصب:
       <link rel="icon" type="image/svg+xml" href="/karban-favicon.svg" />
       <link rel="apple-touch-icon" href="/karban-favicon.svg" />
     ════════════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="کاربان">
  <defs>
    <linearGradient id="favGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C476"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="64" height="64" rx="14" fill="#0A0F1C"/>

  <!-- تیر افقی ترازو -->
  <rect x="14" y="20" width="36" height="2" rx="1" fill="url(#favGold)"/>

  <!-- ستون مرکزی -->
  <rect x="31" y="20" width="2" height="22" fill="url(#favGold)"/>

  <!-- دکمه بالای ستون -->
  <circle cx="32" cy="20" r="2.5" fill="url(#favGold)"/>

  <!-- پایه ستون -->
  <path d="M 26 42 L 38 42 L 36 46 L 28 46 Z" fill="url(#favGold)"/>
  <rect x="24" y="44" width="16" height="2" rx="1" fill="url(#favGold)"/>

  <!-- کفه چپ (متقارن) -->
  <path d="M 18 22 Q 16 28 14 32 Q 18 34 22 34 Q 24 32 22 28 Q 20 24 18 22 Z"
        fill="url(#favGold)"/>

  <!-- کفه راست (متقارن با چپ) -->
  <path d="M 46 22 Q 48 28 50 32 Q 46 34 42 34 Q 40 32 42 28 Q 44 24 46 22 Z"
        fill="url(#favGold)"/>

  <!-- نقطه مرکزی (تأکید) -->
  <circle cx="32" cy="32" r="1.5" fill="#0A0F1C"/>
</svg>
