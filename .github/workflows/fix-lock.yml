name: fix-lockfile
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rm -f package-lock.json && npm install
      - name: commit and push
        run: |
          git config user.name "lockfix-bot"
          git config user.email "lockfix@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: regenerate cross-platform package-lock"
          git push origin main
