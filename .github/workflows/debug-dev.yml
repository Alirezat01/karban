name: debug-dev
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: create debug branch with dev build
        run: |
          git checkout -b debug-dev
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync('package.json'));f.scripts.build='vite build --mode development';fs.writeFileSync('package.json',JSON.stringify(f,null,2)+'\n')"
          git config user.name "diag-bot"
          git config user.email "diag@users.noreply.github.com"
          git add package.json
          git commit -m "debug: development build for full react errors"
          git push -f origin debug-dev
